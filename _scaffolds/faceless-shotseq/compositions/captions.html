<template>
  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
    <div id="capwrap"></div>
  </div>
  <style>
    @font-face{font-family:Inter;src:url('fonts/Inter-700-latin.woff2')}
    #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,Arial,sans-serif}
    /* zona de legenda padrão: y1560–1740, nunca cobre o hero */
    #capwrap{position:absolute;left:0;right:0;top:1560px;height:180px}
    .cue{position:absolute;left:60px;right:60px;top:0;display:flex;justify-content:center;opacity:0}
    .pill{text-align:center;max-width:960px;background:rgba(244,240,232,.96);border-radius:20px;padding:20px 34px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
    .pill span{font:800 44px/1.15 Inter,Arial,sans-serif;color:#9aa6ac;letter-spacing:.3px}
    .pill span.on{color:#0e2a36}
  </style>
  <script src="vendor/gsap.min.js"></script>
  <script src="assets/cues.js"></script>
  <script>
    (function(){
      const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines['captions']=tl;
      const wrap=document.getElementById('capwrap');const cues=window.__cues||[];
      const D = cues.length ? cues[cues.length-1].e + 0.5 : 1;
      tl.to({},{duration:D},0);
      cues.forEach(function(c){
        const cue=document.createElement('div');cue.className='cue';
        const pill=document.createElement('div');pill.className='pill';
        const spans=c.words.map(function(w){const s=document.createElement('span');s.textContent=w.tx+' ';pill.appendChild(s);return s;});
        cue.appendChild(pill);wrap.appendChild(cue);
        tl.set(cue,{opacity:1},c.s);
        tl.set(spans,{color:'#9aa6ac'},c.s);
        c.words.forEach(function(w,i){tl.set(spans[i],{color:'#0e2a36'},w.t);});
        tl.set(cue,{opacity:0},c.e+0.05);
      });
    })();
  </script>
</template>
