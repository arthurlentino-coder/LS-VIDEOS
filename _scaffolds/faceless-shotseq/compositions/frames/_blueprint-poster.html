<template>
  <!-- BLUEPRINT: pôster tipográfico (eyebrow + headline 2 linhas + 1 apoio). Copiar p/ NN-nome.html,
       trocar data-composition-id, o texto e casar D com a data-duration do frame no index. -->
  <div id="root" data-composition-id="XX-poster" data-width="1080" data-height="1920">
    <div id="bg" class="bg clip" data-start="0" data-duration="6.0" data-track-index="0"></div>
    <div class="stage">
      <div class="eyebrow">EYEBROW</div>
      <div class="headline"><span id="h1a">PRIMEIRA LINHA</span><br><span id="h1b" class="cy">SEGUNDA LINHA</span></div>
      <div id="apoio" class="apoio">APOIO / CLAIM CURTA<b id="apoiov">R$ 0</b></div>
    </div>
  </div>
  <style>
    @font-face{font-family:HL;src:url('fonts/ariblk.ttf')}@font-face{font-family:Inter;src:url('fonts/Inter-700-latin.woff2')}
    *{box-sizing:border-box}#root{position:relative;width:1080px;height:1920px;overflow:hidden;color:#f4f7f5;font-family:Inter,Arial,sans-serif}
    .bg{position:absolute;inset:0;background-color:#07131f;background-image:radial-gradient(circle at 70% 30%,rgba(34,211,238,.14),transparent 34%),linear-gradient(rgba(75,139,166,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(75,139,166,.12) 1px,transparent 1px);background-size:auto,64px 64px,64px 64px;transform-origin:60% 40%}
    .stage{position:absolute;inset:0;transform-origin:50% 44%}
    .eyebrow{position:absolute;left:82px;top:150px;padding:12px 22px;border:1px solid #22d3ee;border-radius:999px;color:#22d3ee;font:700 26px Inter;letter-spacing:5px}
    .headline{position:absolute;left:76px;top:250px;width:960px;font:900 96px/1.02 HL,Inter,sans-serif;letter-spacing:1px}.cy{color:#22d3ee}
    .apoio{position:absolute;left:82px;top:620px;font:700 34px Inter;letter-spacing:2px;color:#7895a8}
    .apoio b{display:block;margin-top:14px;font:900 92px HL;color:#fbbf24}
  </style>
  <script src="vendor/gsap.min.js"></script>
  <script>
    (function(){
      const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines['XX-poster']=tl;
      const D=6.0; // <-- casar com data-duration do frame no index
      // --- MOTION DE OURO: nada congela ---
      gsap.set('#h1b',{opacity:0,x:-40});gsap.set('#apoio',{opacity:0,y:30});
      tl.to('.stage',{scale:1.035,duration:D,ease:'none'},0);   // push-in do frame inteiro
      tl.to('.bg',{scale:1.06,duration:D,ease:'none'},0);       // parallax do fundo
      tl.fromTo('.eyebrow',{opacity:.2,x:-30},{opacity:1,x:0,duration:.3},0);
      tl.fromTo('#h1a',{opacity:.25,x:-60},{opacity:1,x:0,duration:.4,ease:'power3.out'},.12);
      tl.to('#h1b',{opacity:1,x:0,duration:.4,ease:'back.out(2)'},.5);
      tl.to('#apoio',{opacity:1,y:0,duration:.4,ease:'back.out(1.7)'},1.1);
      // count-up opcional (apagar se o apoio não é número):
      const v={n:0};tl.to(v,{n:1200,duration:.5,ease:'power1.out',onUpdate:function(){document.getElementById('apoiov').textContent='R$ '+Math.round(v.n).toLocaleString('pt-BR')}},1.2);
      // idle até o fim (desenvolve a duração toda):
      tl.to('.headline',{y:'-=8',duration:1.7,yoyo:true,repeat:Math.max(1,Math.round((D-1.6)/1.7)),ease:'sine.inOut'},1.6);
    })();
  </script>
</template>
