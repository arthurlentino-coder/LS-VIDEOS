<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;
         font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* scrim pra o card verde saltar */
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,20,14,.55),rgba(4,20,14,.30) 40%,rgba(4,20,14,.72));}
  /* card de conversa estilo whatsapp (sem logo/wordmark) */
  .card{position:absolute;left:70px;right:70px;top:470px;border-radius:34px;overflow:hidden;
        box-shadow:0 40px 90px rgba(0,0,0,.55);background:#ECE5DD}
  .hdr{display:flex;align-items:center;gap:22px;background:#075E54;padding:34px 34px;color:#fff}
  .av{width:100px;height:100px;border-radius:50%;background:#0e1a2f;overflow:hidden;flex:none;
      display:flex;align-items:center;justify-content:center}
  .av img{width:100%;height:100%;object-fit:cover}
  .who{display:flex;flex-direction:column}
  .nm{font-size:38px;font-weight:700;letter-spacing:.3px}
  .st{font-size:26px;color:#a7e9cf;margin-top:6px;position:relative;height:32px}
  .st > span{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;white-space:nowrap}
  #stTyping{opacity:0;color:#cdeede;font-style:italic}
  .online{width:16px;height:16px;border-radius:50%;background:#25D366;display:inline-block;box-shadow:0 0 0 3px rgba(37,211,102,.25)}
  .body{padding:40px 34px 46px;min-height:520px;position:relative;
        background-image:radial-gradient(rgba(0,0,0,.04) 2px,transparent 2px);background-size:26px 26px}
  .row{display:flex;margin-bottom:30px}
  .row.out{justify-content:flex-end}
  .bub{max-width:74%;padding:26px 30px;border-radius:26px;font-size:36px;line-height:1.32;color:#0b1f18;
       box-shadow:0 4px 10px rgba(0,0,0,.10);position:relative}
  .in .bub{background:#fff;border-top-left-radius:8px}
  .out .bub{background:#DCF8C6;border-top-right-radius:8px}
  .meta{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px;font-size:22px;color:#5b6b62}
  .ticks{position:relative;width:44px;height:22px}
  .ticks svg{position:absolute;left:0;top:0}
  /* indicador de digitando */
  .typing{display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:26px;border-top-left-radius:8px;
          padding:30px 34px;box-shadow:0 4px 10px rgba(0,0,0,.10)}
  .dot{width:18px;height:18px;border-radius:50%;background:#9fb3a8}
  /* FAB verde de enviar */
  .fab{position:absolute;right:44px;bottom:-40px;width:118px;height:118px;border-radius:50%;background:#25D366;
       display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(0,0,0,.30)}
  #rowTyping{position:absolute;top:40px;left:34px;margin:0}
</style>
</head>
<body>
<div id="stage" data-composition-id="wa" data-start="0" data-duration="6.5" data-fps="25" data-width="1080" data-height="1920">
  <video id="bg" class="clip" src="bg.mp4" muted playsinline data-start="0" data-duration="6.5" data-track-index="1"></video>
  <div class="scrim"></div>

  <div class="card" id="card">
    <div class="hdr">
      <div class="av"><img src="avatar.png" alt="Lucas Silva"></div>
      <div class="who">
        <div class="nm">Lucas Silva</div>
        <div class="st">
          <span id="stOnline"><span class="online"></span>online</span>
          <span id="stTyping">digitando…</span>
        </div>
      </div>
    </div>
    <div class="body">
      <div class="row in" id="rowIn">
        <div class="bub">Já garantiu sua vaga? 👀</div>
      </div>
      <div class="row in" id="rowTyping">
        <div class="typing"><span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span></div>
      </div>
      <div class="row out" id="rowOut">
        <div class="bub">
          Sim, acabei de garantir! ✅
          <div class="meta"><span>agora</span>
            <span class="ticks" id="ticks">
              <svg width="44" height="22" viewBox="0 0 44 22" fill="none">
                <path id="t1" d="M2 12 L9 19 L22 3" stroke="#34B7F1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path id="t2" d="M14 12 L21 19 L34 3" stroke="#34B7F1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
        </div>
      </div>
      <div class="fab" id="fab">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M3 20l18-8L3 4v6l12 2-12 2v6z" fill="#fff"/></svg>
      </div>
    </div>
  </div>
</div>

<script src="vendor/gsap.min.js"></script>
<script>
(function(){
  const D=6.5;
  const tl=gsap.timeline({paused:true});
  window.__timelines=window.__timelines||{}; window.__timelines['wa']=tl;

  // estados iniciais
  gsap.set('#card',{scale:.86,opacity:0,transformOrigin:'50% 70%'});
  gsap.set('#rowIn',{opacity:0,x:-40});
  gsap.set('#rowTyping',{opacity:0,x:-30});
  gsap.set('#rowOut',{opacity:0,x:50,scale:.9,transformOrigin:'100% 50%'});
  gsap.set('#ticks',{opacity:0});
  gsap.set('#t2',{opacity:0});
  gsap.set('#stTyping',{opacity:0});
  gsap.set('#fab',{scale:0,opacity:0,transformOrigin:'50% 50%'});
  gsap.set(['#d1','#d2','#d3'],{y:0,opacity:.5});

  tl.to({},{duration:D},0); // trava a duração total

  // card entra
  tl.to('#card',{scale:1,opacity:1,duration:.5,ease:'back.out(1.5)'},.2);
  tl.to('#fab',{scale:1,opacity:1,duration:.4,ease:'back.out(2)'},.5);

  // 1) LUCAS DIGITANDO (esquerda) + status "digitando…"
  tl.to('#stOnline',{opacity:0,duration:.25},.7);
  tl.to('#stTyping',{opacity:1,duration:.25},.75);
  tl.to('#rowTyping',{opacity:1,x:0,duration:.35,ease:'power2.out'},.7);
  tl.to('#d1',{y:-12,opacity:1,duration:.28,yoyo:true,repeat:4,ease:'sine.inOut'},.9);
  tl.to('#d2',{y:-12,opacity:1,duration:.28,yoyo:true,repeat:4,ease:'sine.inOut'},1.02);
  tl.to('#d3',{y:-12,opacity:1,duration:.28,yoyo:true,repeat:4,ease:'sine.inOut'},1.14);

  // 2) digitando some -> MENSAGEM DO LUCAS entra no mesmo lugar; status volta p/ online
  tl.to('#rowTyping',{opacity:0,x:-16,duration:.25,ease:'power2.in'},2.15);
  tl.to('#stTyping',{opacity:0,duration:.25},2.15);
  tl.to('#stOnline',{opacity:1,duration:.25},2.2);
  tl.to('#rowIn',{opacity:1,x:0,duration:.4,ease:'back.out(1.5)'},2.28);

  // 3) A DONA DO CELULAR RESPONDE (verde, direita) + ticks
  tl.to('#rowOut',{opacity:1,x:0,scale:1,duration:.45,ease:'back.out(1.6)'},3.6);
  tl.to('#ticks',{opacity:1,duration:.2},4.1);
  tl.to('#t2',{opacity:1,duration:.25,ease:'power2.out'},4.5);

  // respiro
  tl.to('#card',{y:-10,duration:1.4,yoyo:true,repeat:1,ease:'sine.inOut'},4.9);
  tl.to('#fab',{scale:1.08,duration:.7,yoyo:true,repeat:2,ease:'sine.inOut'},5.0);
})();
</script>
</body>
</html>
